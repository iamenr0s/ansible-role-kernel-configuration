---
galaxy_info:
  role_name: ansible_role_kernel_configuration
  author: "iamenr0s"
  description: "Configure kernel parameters per distro major version via sysctl"
  license: MIT
  min_ansible_version: "2.9"
  platforms:
    - name: "EL"
      versions:
        - "8"
        - "9"
        - "10"
    - name: "Rocky"
      versions:
        - "all"
    - name: "Fedora"
      versions:
        - "42"
        - "43"
        - "44"
    - name: "Debian"
      versions:
        - "bookworm"
        - "trixie"
    - name: "Ubuntu"
      versions:
        - "jammy"
        - "noble"

  galaxy_tags:
    - kernel
    - sysctl
    - performance
    - security
dependencies: []
collections:
  - ansible.posix
  - community.general
